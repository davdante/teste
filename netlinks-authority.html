        // ================== STORE (GERENCIAMENTO DE ESTADO) ==================
        class Store {
            constructor() {
                this.data = {};
                this.listeners = [];
                this.init();
            }
            
            init() {
                const isFirstTime = !localStorage.getItem('netlinks_initialized');
                
                if (isFirstTime) {
                    this.resetToSeeds();
                } else {
                    this.loadFromStorage();
                }
            }
            
            resetToSeeds() {
                Object.keys(SEED_DATA).forEach(key => {
                    this.data[key] = JSON.parse(JSON.stringify(SEED_DATA[key]));
                    localStorage.setItem(`netlinks_${key}`, JSON.stringify(this.data[key]));
                });
                
                localStorage.setItem('netlinks_initialized', 'true');
                localStorage.removeItem('netlinks_currentUser');
                this.data.currentUser = null;
                
                this.notify();
                showToast('Sistema resetado com sucesso!', 'success');
            }
            
            loadFromStorage() {
                Object.keys(SEED_DATA).forEach(key => {
                    const stored = localStorage.getItem(`netlinks_${key}`);
                    this.data[key] = stored ? JSON.parse(stored) : SEED_DATA[key];
                });
                
                const currentUser = localStorage.getItem('netlinks_currentUser');
                this.data.currentUser = currentUser ? JSON.parse(currentUser) : null;
            }
            
            get(key) {
                return this.data[key];
            }
            
            set(key, value) {
                this.data[key] = value;
                if (key === 'currentUser') {
                    if (value) {
                        localStorage.setItem('netlinks_currentUser', JSON.stringify(value));
                    } else {
                        localStorage.removeItem('netlinks_currentUser');
                    }
                } else {
                    localStorage.setItem(`netlinks_${key}`, JSON.stringify(value));
                }
                this.notify();
            }
            
            subscribe(callback) {
                this.listeners.push(callback);
            }
            
            notify() {
                this.listeners.forEach(cb => cb(this.data));
            }
        }

        // ================== ROUTER ==================
        class Router {
            constructor() {
                this.currentRoute = null;
                this.mobileMenuOpen = false;
                this.init();
            }
            
            init() {
                window.addEventListener('hashchange', () => this.handleRoute());
                this.handleRoute();
            }
            
            handleRoute() {
                const hash = window.location.hash.slice(1) || 'login';
                const user = store.get('currentUser');
                
                if (hash !== 'login' && !user) {
                    window.location.hash = 'login';
                    return;
                }
                
                if (hash === 'login' && user) {
                    window.location.hash = 'dashboard';
                    return;
                }
                
                this.currentRoute = hash;
                this.render(hash);
            }
            
            render(route) {
                const app = document.getElementById('app');
                
                if (route === 'login') {
                    app.innerHTML = this.renderLogin();
                } else {
                    const user = store.get('currentUser');
                    if (user.role === 'admin') {
                        app.innerHTML = this.renderAdminLayout();
                    } else {
                        app.innerHTML = this.renderClientLayout();
                    }
                    
                    const content = document.getElementById('content');

            initRoiPredictor() {
                const ctx = document.getElementById('roiProjectionChart');
                const btn = document.getElementById('roiCalcBtn');
                if (!ctx || !btn) return;
                const compute = () => {
                    const budget = Number(document.getElementById('roiBudget').value || 0);
                    const a = Number(document.getElementById('mixA').value||0)/100;
                    const b = Number(document.getElementById('mixB').value||0)/100;
                    const c = Number(document.getElementById('mixC').value||0)/100;
                    const months = Math.max(1, Number(document.getElementById('roiMonths').value||6));
                    const tierLift = (a*1.0 + b*0.6 + c*0.35); // simplificado
                    const base = budget * 0.02; // conversão base
                    const values = Array.from({length: months}, (_, i) => Math.round(base * (1 + tierLift) * (1 + i*0.15)));
                    return { labels: values.map((_, i) => `M${i+1}`), values };
                };
                const initial = compute();
                let chart = new Chart(ctx.getContext('2d'), {
                    type: 'bar', data: { labels: initial.labels, datasets: [{ label: 'Receita estimada (R$)', data: initial.values, backgroundColor: 'rgba(16,185,129,0.6)' }] },
                    options: { plugins: { legend: { labels: { color: '#fff' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
                });
                btn.onclick = () => { const next = compute(); chart.data.labels = next.labels; chart.data.datasets[0].data = next.values; chart.update(); showToast('ROI recalculado', 'success'); };
            }

            initExporters() {
                const toCSV = (obj) => {
                    const rows = Object.entries(obj).map(([k,v]) => `${k},${JSON.stringify(v)}`);
                    return 'chave,valor\n' + rows.join('\n');
                };
                const download = (name, content, type='text/plain') => {
                    const blob = new Blob([content], {type});
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = name;
                    a.click();
                };
                const btnJ = document.getElementById('exportJSON');
                const btnC = document.getElementById('exportCSV');
                const btnC2 = document.getElementById('exportCSV2');
                const user = store.get('currentUser');
                const client = user ? store.get('clients').find(c => c.name === user.company) : null;
                if (btnJ) btnJ.onclick = () => download('report.json', JSON.stringify(client || store.data, null, 2), 'application/json');
                if (btnC) btnC.onclick = () => download('report.csv', toCSV(client || {}), 'text/csv');
                if (btnC2) btnC2.onclick = () => download('export.csv', toCSV(client || {}), 'text/csv');
            }

                const btn = document.getElementById('triCalc');
                const out = document.getElementById('triResult');
                const donut = document.getElementById('triDonut');
                if (!btn || !out || !donut) return;
                let chart = new Chart(donut.getContext('2d'), {
                    type: 'doughnut', data: { labels: ['Cliente','Parceiro','Rede'], datasets: [{ data: [70,20,10], backgroundColor: ['#6366f1','#f59e0b','#10b981'] }] }, options: { plugins: { legend: { labels: { color: '#fff' } } } }
                });
                btn.onclick = () => {
                    const p = Number(price.value||0);
                    const pr = Number(partner.value||0);
                    const nw = Number(network.value||0);
                    const cl = Math.max(0, 100 - pr - nw);
                    chart.data.datasets[0].data = [cl, pr, nw];
                    chart.update();
                    const roi = (cl/100)*p*3/(p) * 100; // retorno relativo simples
                    out.innerHTML = `<div class="mt-2">Distribuição: Cliente ${cl}% • Parceiro ${pr}% • Rede ${nw}%<br><span class="text-green-400 font-semibold">ROI relativo estimado: ${roi.toFixed(0)}%</span></div>`;
                };
                btn.click();
            }
            
            initAdminAnalytics() {
                const r = document.getElementById('admRevenue');
                const a = document.getElementById('admAuthority');
                if (r) new Chart(r.getContext('2d'), { type: 'bar', data: { labels: ['Q1','Q2','Q3','Q4'], datasets: [{ label: 'MRR (R$)', data: [200000,750000,2100000,3500000], backgroundColor: 'rgba(99,102,241,0.6)'}] }, options: { plugins: { legend: { labels: { color:'#fff' } } }, scales: { x: { ticks:{ color:'#94a3b8' } }, y:{ ticks:{ color:'#94a3b8' } } } } });
                if (a) new Chart(a.getContext('2d'), { type: 'pie', data: { labels: store.get('clients').map(c=>c.name), datasets: [{ data: store.get('clients').map(c=>c.currentNS), backgroundColor: ['#6366f1','#f59e0b','#10b981','#ef4444','#8b5cf6'] }] }, options: { plugins: { legend: { labels: { color:'#fff' } } } } });
            }
        }

        // ================== FUNÇÕES GLOBAIS ==================
        
        function showLoader() {
            document.getElementById('globalLoader').classList.remove('hidden');
        }
        
        function hideLoader() {
            document.getElementById('globalLoader').classList.add('hidden');
        }
        
        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const colors = {
                success: 'from-green-500 to-green-600',
                error: 'from-red-500 to-red-600',
                warning: 'from-yellow-500 to-yellow-600',
                info: 'from-blue-500 to-blue-600'
            };
            
            toast.className = `glass-dark p-4 rounded-lg mb-2 animate-slide-down`;
            toast.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-2 h-8 bg-gradient-to-b ${colors[type]} rounded-full"></div>
                    <p class="text-white">${message}</p>
                </div>
            `;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease-out forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        async function fakeDelay(ms = 800) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // Login Functions
        function updateClientUsers() {
            const company = document.getElementById('clientCompany').value;
            const userSelect = document.getElementById('clientEmail');
            const passwordInput = document.getElementById('clientPassword');
            const passwordHint = document.getElementById('clientPasswordHint');
            const loginBtn = document.getElementById('clientLoginBtn');
            
            if (company) {
                const users = store.get('users').filter(u => u.company === company);
                
                userSelect.innerHTML = users.map(user => 
                    `<option value="${user.email}">${user.name}</option>`
                ).join('');
                
                userSelect.disabled = false;
                passwordInput.disabled = false;
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                loginBtn.classList.add('btn-premium');
                
                // Set password hint based on company
                const hints = {
                    'Binance': 'binance123',
                    'BYD': 'byd123',
                    'Banco BTG': 'btg123',
                    'Clínica Karina': 'clinica123',
                    'Mercado Livre': 'meli123'
                };
                passwordHint.textContent = `Default: ${hints[company]}`;
            } else {
                userSelect.innerHTML = '<option value="">First select company...</option>';
                userSelect.disabled = true;
                passwordInput.disabled = true;
                loginBtn.disabled = true;
                loginBtn.classList.add('opacity-50', 'cursor-not-allowed');
                loginBtn.classList.remove('btn-premium');
                passwordHint.textContent = '';
            }
        }
        
        async function handleAdminLogin(event) {
            event.preventDefault();
            showLoader();
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            
            await fakeDelay();
            
            const user = store.get('users').find(u => u.email === email);
            
            if (user && (password === 'admin123' || password === 'tech123' || password === user.password)) {
                store.set('currentUser', user);
                showToast('Login successful! Welcome Admin.', 'success');
                setTimeout(() => {
                    window.location.hash = 'dashboard';
                }, 500);
            } else {
                showToast('Invalid credentials!', 'error');
            }
            
            hideLoader();
        }
        
        async function handleClientLogin(event) {
            event.preventDefault();
            showLoader();
            
            const email = document.getElementById('clientEmail').value;
            const password = document.getElementById('clientPassword').value;
            
            await fakeDelay();
            
            const user = store.get('users').find(u => u.email === email);
            
            if (user && password === user.password) {
                store.set('currentUser', user);
                showToast(`Welcome to ${user.company} Dashboard!`, 'success');
                setTimeout(() => {
                    window.location.hash = 'dashboard';
                }, 500);
            } else {
                showToast('Invalid credentials!', 'error');
            }
            
            hideLoader();
        }
        
        function logout() {
            showLoader();
            store.set('currentUser', null);
            showToast('Logged out successfully', 'info');
            setTimeout(() => {
                window.location.hash = 'login';
                hideLoader();
            }, 500);
        }

        // ================== INICIALIZAÇÃO ==================
        let store, router;
        
        document.addEventListener('DOMContentLoaded', () => {
            store = new Store();
            router = new Router();
            
            // Attach global functions to window
            window.store = store;
            window.router = router;
            window.showLoader = showLoader;
            window.hideLoader = hideLoader;
            window.showToast = showToast;
            window.logout = logout;
            window.updateClientUsers = updateClientUsers;
            window.handleAdminLogin = handleAdminLogin;
            window.handleClientLogin = handleClientLogin;
        });
    </script>
</body>
</html>
